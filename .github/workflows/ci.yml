name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package application
        run: npm run package -- --${{ runner.os == 'Linux' && 'linux' || 'win' }} --x64 --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Test packaged Linux app
        if: runner.os == 'Linux'
        env:
          KMM_PACKAGED_EXECUTABLE: release/linux-unpacked/kenshi-mod-manager
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:packaged
      - name: Test packaged Windows app
        if: runner.os == 'Windows'
        env:
          KMM_PACKAGED_EXECUTABLE: release/win-unpacked/Kenshi Mod Manager.exe
        run: npm run test:packaged
      - name: Desktop workflow
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:ui
